[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-delivery-performance-analysis"
version = "0.1.0"
description = "Reproducible Olist delivery-performance analytics for SQL Server and Power BI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.2,<3",
    "pyodbc>=5.2,<6",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "sqlserver: requires a separately configured SQL Server test database",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
